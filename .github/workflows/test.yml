name: checks
on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    name: the repo follows its own rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install numpy pytest
      - run: pytest tests/ -q
      - run: python examples/toy_loop.py
      # The reference list once cited FunSearch as Nature 2023 (it is Nature 625, 2024).
      # Weekly, resolve every identifier and compare the year and first author the
      # page states with what Crossref and arXiv return. Not on push: network.
      - if: github.event_name != 'push' && github.event_name != 'pull_request'
        env:
          REFERENCES_ONLINE: "1"
        run: pytest tests/test_references.py -q
